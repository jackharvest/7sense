[package]
name = "sevensense-daemon"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "7sense-daemon"
path = "src/main.rs"

[dependencies]
ksni = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
