name: Build and publish release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build daemon (x86_64)
        run: |
          cd 7sense-daemon
          cargo build --release

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # ── Universal tarball ────────────────────────────────────────────────────

      - name: Build tarball
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          STAGEDIR="7sense-${VERSION}"
          mkdir -p "${STAGEDIR}/7sense-daemon/target/release"
          mkdir -p "${STAGEDIR}/sevensense"
          cp 7sense "${STAGEDIR}/7sense"
          cp -r sevensense/. "${STAGEDIR}/sevensense/"
          find "${STAGEDIR}/sevensense" -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          cp 7sense-daemon/target/release/7sense-daemon \
             "${STAGEDIR}/7sense-daemon/target/release/7sense-daemon"
          cp README.md "${STAGEDIR}/README.md"
          tar -czf "7Sense-any-linux.tar.gz" "${STAGEDIR}/"
          echo "TARBALL=7Sense-any-linux.tar.gz" >> $GITHUB_ENV

      # ── .deb — Debian / Ubuntu / Mint ───────────────────────────────────────

      - name: Build .deb package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}
          DEBROOT="deb-staging"
          mkdir -p "${DEBROOT}/DEBIAN"
          mkdir -p "${DEBROOT}/opt/7sense/7sense-daemon/target/release"
          mkdir -p "${DEBROOT}/opt/7sense/sevensense"
          mkdir -p "${DEBROOT}/usr/local/bin"
          mkdir -p "${DEBROOT}/usr/share/applications"
          mkdir -p "${DEBROOT}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEBROOT}/usr/share/metainfo"
          mkdir -p "${DEBROOT}/usr/share/7sense"

          cp 7sense "${DEBROOT}/opt/7sense/7sense"
          cp -r sevensense/. "${DEBROOT}/opt/7sense/sevensense/"
          find "${DEBROOT}/opt/7sense/sevensense" -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          cp 7sense-daemon/target/release/7sense-daemon \
             "${DEBROOT}/opt/7sense/7sense-daemon/target/release/7sense-daemon"
          mkdir -p "${DEBROOT}/usr/share/icons/hicolor/64x64/apps"
          mkdir -p "${DEBROOT}/usr/share/icons/hicolor/128x128/apps"
          cp sevensense/icon.png \
             "${DEBROOT}/usr/share/icons/hicolor/256x256/apps/7sense.png"
          cp assets/icon-64.png \
             "${DEBROOT}/usr/share/icons/hicolor/64x64/apps/7sense.png"
          cp assets/icon-128.png \
             "${DEBROOT}/usr/share/icons/hicolor/128x128/apps/7sense.png"
          cp assets/icon-64.png \
             "${DEBROOT}/usr/share/7sense/icon-64.png"
          cp assets/icon-128.png \
             "${DEBROOT}/usr/share/7sense/icon-128.png"
          cp assets/io.github.jackharvest.7sense.metainfo.xml \
             "${DEBROOT}/usr/share/metainfo/io.github.jackharvest.7sense.metainfo.xml"
          cp assets/7sense-apt.gpg.asc \
             "${DEBROOT}/usr/share/7sense/7sense-apt.gpg.asc"

          ln -s /opt/7sense/7sense "${DEBROOT}/usr/local/bin/7sense"

          cat > "${DEBROOT}/usr/share/applications/7sense.desktop" << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=7Sense
          Comment=Real extraction progress for archive tools
          Exec=/opt/7sense/7sense
          Icon=7sense
          Categories=Utility;
          StartupNotify=false
          EOF

          INSTALLED_SIZE=$(du -sk "${DEBROOT}" | cut -f1)

          cat > "${DEBROOT}/DEBIAN/control" << EOF
          Package: 7sense
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_SIZE}
          Depends: python3 (>= 3.9), python3-pyqt6, libnotify-bin
          Maintainer: jackharvest <im.jackharvest@gmail.com>
          Homepage: https://github.com/jackharvest/7sense
          Description: Real extraction progress for Linux archive tools
           7Sense sits in your system tray and shows real extraction progress —
           actual percentages and time remaining — for 7-Zip, tar, zip, and RAR.
           No changes to your existing tools required. ~4 MB RAM at idle.
          EOF

          cp packaging/postinst "${DEBROOT}/DEBIAN/postinst"
          cp packaging/prerm "${DEBROOT}/DEBIAN/prerm"
          cp packaging/postrm "${DEBROOT}/DEBIAN/postrm"
          chmod 755 "${DEBROOT}/DEBIAN/postinst"
          chmod 755 "${DEBROOT}/DEBIAN/prerm"
          chmod 755 "${DEBROOT}/DEBIAN/postrm"
          chmod 755 "${DEBROOT}/opt/7sense/7sense"
          chmod 755 "${DEBROOT}/opt/7sense/7sense-daemon/target/release/7sense-daemon"

          dpkg-deb --build --root-owner-group "${DEBROOT}" \
            "7Sense-ubuntu-debian-mint.deb"
          echo "DEB=7Sense-ubuntu-debian-mint.deb" >> $GITHUB_ENV

      # ── .rpm — Fedora / RHEL / openSUSE ─────────────────────────────────────
      # Uses a Fedora container so rpmbuild is available without polluting the runner.

      - name: Build .rpm package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Stage files the container will pick up
          mkdir -p /tmp/rpm-src/opt/7sense/7sense-daemon/target/release
          mkdir -p /tmp/rpm-src/opt/7sense/sevensense
          cp 7sense /tmp/rpm-src/opt/7sense/7sense
          cp -r sevensense/. /tmp/rpm-src/opt/7sense/sevensense/
          find /tmp/rpm-src/opt/7sense/sevensense -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          cp 7sense-daemon/target/release/7sense-daemon \
             /tmp/rpm-src/opt/7sense/7sense-daemon/target/release/7sense-daemon
          cp sevensense/icon.png /tmp/rpm-src/icon.png

          cat > /tmp/rpm-src/7sense.spec << EOF
          Name:           7sense
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Real extraction progress for Linux archive tools
          License:        MIT
          URL:            https://github.com/jackharvest/7sense
          BuildArch:      x86_64

          Requires:       python3 >= 3.9
          Requires:       python3-pyqt6
          Requires:       libnotify

          %description
          7Sense sits in your system tray and shows real extraction progress —
          actual percentages and time remaining — for 7-Zip, tar, zip, and RAR.
          No changes to your existing tools required. ~4 MB RAM at idle.

          %install
          mkdir -p %{buildroot}/opt/7sense/7sense-daemon/target/release
          mkdir -p %{buildroot}/opt/7sense/sevensense
          mkdir -p %{buildroot}/usr/local/bin
          mkdir -p %{buildroot}/usr/share/applications
          mkdir -p %{buildroot}/usr/share/icons/hicolor/256x256/apps
          cp -r /src/opt/7sense/. %{buildroot}/opt/7sense/
          cp /src/icon.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/7sense.png
          ln -s /opt/7sense/7sense %{buildroot}/usr/local/bin/7sense
          cat > %{buildroot}/usr/share/applications/7sense.desktop << 'DEOF'
          [Desktop Entry]
          Type=Application
          Name=7Sense
          Comment=Real extraction progress for archive tools
          Exec=/opt/7sense/7sense
          Icon=7sense
          Categories=Utility;
          StartupNotify=false
          DEOF

          %files
          /opt/7sense/
          /usr/local/bin/7sense
          /usr/share/applications/7sense.desktop
          /usr/share/icons/hicolor/256x256/apps/7sense.png

          %post
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
              gtk-update-icon-cache /usr/share/icons/hicolor || true
          fi

          %postun
          if [ \$1 -eq 0 ]; then
              getent passwd | awk -F: '\$3 >= 1000 && \$3 < 65534 { print \$6 }' | while read -r home; do
                  [ -d "\$home" ] || continue
                  rm -rf "\$home/.config/7sense"
                  rm -f "\$home/.config/autostart/7sense.desktop"
              done
          fi
          EOF

          docker run --rm \
            -v /tmp/rpm-src:/src:ro \
            -v /tmp/rpm-out:/out \
            fedora:40 \
            bash -c "
              dnf install -y rpm-build python3-pyqt6 libnotify 2>/dev/null
              mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
              cp /src/7sense.spec /root/rpmbuild/SPECS/
              rpmbuild -bb /root/rpmbuild/SPECS/7sense.spec \
                --define '_sourcedir /src' \
                --define 'src /src'
              cp /root/rpmbuild/RPMS/x86_64/*.rpm /out/
            "

          RPM_FILE=$(ls /tmp/rpm-out/*.rpm | head -1)
          DEST="7Sense-fedora-rhel-opensuse.rpm"
          cp "${RPM_FILE}" "${DEST}"
          echo "RPM=${DEST}" >> $GITHUB_ENV

      # ── .pkg.tar.zst — Arch / Manjaro ───────────────────────────────────────
      # Uses an Arch Linux container so makepkg is available.

      - name: Build Arch package
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          mkdir -p /tmp/arch-src/opt/7sense/7sense-daemon/target/release
          mkdir -p /tmp/arch-src/opt/7sense/sevensense
          cp 7sense /tmp/arch-src/opt/7sense/7sense
          cp -r sevensense/. /tmp/arch-src/opt/7sense/sevensense/
          find /tmp/arch-src/opt/7sense/sevensense -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          cp 7sense-daemon/target/release/7sense-daemon \
             /tmp/arch-src/opt/7sense/7sense-daemon/target/release/7sense-daemon
          cp sevensense/icon.png /tmp/arch-src/icon.png

          cat > /tmp/arch-src/PKGBUILD << EOF
          pkgname=7sense
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Real extraction progress for Linux archive tools"
          arch=('x86_64')
          url="https://github.com/jackharvest/7sense"
          license=('MIT')
          depends=('python' 'python-pyqt6' 'libnotify')
          source=()
          sha256sums=()

          package() {
            mkdir -p "\${pkgdir}/opt/7sense/7sense-daemon/target/release"
            mkdir -p "\${pkgdir}/opt/7sense/sevensense"
            mkdir -p "\${pkgdir}/usr/local/bin"
            mkdir -p "\${pkgdir}/usr/share/applications"
            mkdir -p "\${pkgdir}/usr/share/icons/hicolor/256x256/apps"

            cp -r /src/opt/7sense/. "\${pkgdir}/opt/7sense/"
            cp /src/icon.png "\${pkgdir}/usr/share/icons/hicolor/256x256/apps/7sense.png"
            ln -s /opt/7sense/7sense "\${pkgdir}/usr/local/bin/7sense"

            cat > "\${pkgdir}/usr/share/applications/7sense.desktop" << 'DEOF'
          [Desktop Entry]
          Type=Application
          Name=7Sense
          Comment=Real extraction progress for archive tools
          Exec=/opt/7sense/7sense
          Icon=7sense
          Categories=Utility;
          StartupNotify=false
          DEOF

            chmod 755 "\${pkgdir}/opt/7sense/7sense"
            chmod 755 "\${pkgdir}/opt/7sense/7sense-daemon/target/release/7sense-daemon"
          }

          pre_remove() {
            getent passwd | awk -F: '\$3 >= 1000 && \$3 < 65534 { print \$6 }' | while read -r home; do
              [ -d "\$home" ] || continue
              rm -rf "\$home/.config/7sense"
              rm -f "\$home/.config/autostart/7sense.desktop"
            done
          }
          EOF

          mkdir -p /tmp/arch-out

          docker run --rm \
            -v /tmp/arch-src:/src:ro \
            -v /tmp/arch-out:/out \
            archlinux:latest \
            bash -c "
              pacman -Sy --noconfirm base-devel python-pyqt6 libnotify 2>/dev/null
              useradd -m builder
              cp /src/PKGBUILD /home/builder/PKGBUILD
              chown builder /home/builder/PKGBUILD
              cd /home/builder
              sudo -u builder makepkg --nodeps --nocheck 2>/dev/null
              cp /home/builder/*.pkg.tar.zst /out/
            "

          PKG_FILE=$(ls /tmp/arch-out/*.pkg.tar.zst | head -1)
          DEST="7Sense-arch-manjaro.pkg.tar.zst"
          cp "${PKG_FILE}" "${DEST}"
          echo "ARCH_PKG=${DEST}" >> $GITHUB_ENV

      # ── Upload everything ────────────────────────────────────────────────────

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.TARBALL }}
            ${{ env.DEB }}
            ${{ env.RPM }}
            ${{ env.ARCH_PKG }}

      # ── Update apt repository on gh-pages ────────────────────────────────────
      # Rebuilds the Packages + Release files and re-signs, so apt users get
      # the new version automatically on their next `sudo apt update`.

      - name: Update apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Import the GPG signing key
          echo "${APT_SIGNING_KEY}" | gpg --batch --import

          # Check out gh-pages into a temp directory
          git clone --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jackharvest/7sense.git" \
            /tmp/gh-pages

          # Drop the new .deb in the pool
          cp "7Sense-ubuntu-debian-mint.deb" /tmp/gh-pages/pool/main/7Sense-ubuntu-debian-mint.deb

          # Rebuild Packages index
          cd /tmp/gh-pages
          DEB="pool/main/7Sense-ubuntu-debian-mint.deb"
          PKG_SIZE=$(stat -c%s "$DEB")
          PKG_MD5=$(md5sum "$DEB" | cut -d' ' -f1)
          PKG_SHA1=$(sha1sum "$DEB" | cut -d' ' -f1)
          PKG_SHA256=$(sha256sum "$DEB" | cut -d' ' -f1)

          # Pull version/deps from the .deb control file
          CTRL=$(dpkg-deb --field "$DEB")
          PKG_VERSION=$(echo "$CTRL" | grep ^Version | cut -d' ' -f2)
          PKG_DEPENDS=$(echo "$CTRL" | grep ^Depends | sed 's/Depends: //')

          cat > dists/stable/main/binary-amd64/Packages << EOF
          Package: 7sense
          Version: ${PKG_VERSION}
          Architecture: amd64
          Maintainer: jackharvest <im.jackharvest@gmail.com>
          Depends: ${PKG_DEPENDS}
          Section: utils
          Priority: optional
          Homepage: https://github.com/jackharvest/7sense
          Description: Real extraction progress for Linux archive tools
           7Sense sits in your system tray and shows real extraction progress —
           actual percentages and time remaining — for 7-Zip, tar, zip, and RAR.
           No changes to your existing tools required. ~4 MB RAM at idle.
          Filename: pool/main/7Sense-ubuntu-debian-mint.deb
          Size: ${PKG_SIZE}
          MD5sum: ${PKG_MD5}
          SHA1: ${PKG_SHA1}
          SHA256: ${PKG_SHA256}
          EOF

          gzip -9c dists/stable/main/binary-amd64/Packages \
            > dists/stable/main/binary-amd64/Packages.gz

          # Rebuild DEP-11 catalog — the Package: field is what links the AppStream
          # component to the dpkg package, making it appear in Discover's Installed list.
          mkdir -p dists/stable/main/dep11
          cat > dists/stable/main/dep11/Components-amd64.yml << EOF
          ---
          File: DEP-11
          Version: '0.14'
          Origin: jackharvest-7sense
          ---
          Type: DesktopApp
          ID: io.github.jackharvest.7sense
          Package: 7sense
          Name:
            C: 7Sense
          Summary:
            C: Real extraction progress for Linux archive tools
          Description:
            C: >-
              <p>7Sense sits in your system tray and shows real extraction progress —
              actual percentages and time remaining — for 7-Zip, tar, zip, and RAR.
              No changes to your existing tools required. Around 4 MB RAM at idle.</p>
          ProjectLicense: MIT
          Url:
            homepage: https://github.com/jackharvest/7sense
            bugtracker: https://github.com/jackharvest/7sense/issues
          Icon:
            stock: 7sense
          Categories:
          - Utility
          Releases:
          - version: '${VERSION}'
            unix-timestamp: $(date +%s)
          EOF
          gzip -9c dists/stable/main/dep11/Components-amd64.yml \
            > dists/stable/main/dep11/Components-amd64.yml.gz

          # Rebuild and re-sign Release with all file checksums
          get_md5()   { echo " $(md5sum $1 | cut -d' ' -f1) $(stat -c%s $1) $(echo $1 | sed 's|dists/stable/||')"; }
          get_sha256(){ echo " $(sha256sum $1 | cut -d' ' -f1) $(stat -c%s $1) $(echo $1 | sed 's|dists/stable/||')"; }

          cat > dists/stable/Release << EOF
          Origin: jackharvest
          Label: 7Sense
          Suite: stable
          Codename: stable
          Date: $(date -Ru)
          Architectures: amd64
          Components: main
          Description: 7Sense apt repository
          MD5Sum:
          $(get_md5 dists/stable/main/binary-amd64/Packages)
          $(get_md5 dists/stable/main/binary-amd64/Packages.gz)
          $(get_md5 dists/stable/main/dep11/Components-amd64.yml)
          $(get_md5 dists/stable/main/dep11/Components-amd64.yml.gz)
          SHA256:
          $(get_sha256 dists/stable/main/binary-amd64/Packages)
          $(get_sha256 dists/stable/main/binary-amd64/Packages.gz)
          $(get_sha256 dists/stable/main/dep11/Components-amd64.yml)
          $(get_sha256 dists/stable/main/dep11/Components-amd64.yml.gz)
          EOF

          gpg --default-key im.jackharvest@gmail.com \
              --clearsign --output dists/stable/InRelease \
              dists/stable/Release
          gpg --default-key im.jackharvest@gmail.com \
              --detach-sign --armor --output dists/stable/Release.gpg \
              dists/stable/Release

          # Push changes back to gh-pages
          git config user.name "jackharvest"
          git config user.email "im.jackharvest@gmail.com"
          git add -A
          git commit -m "apt repo: update to v${VERSION}"
          git push origin gh-pages
